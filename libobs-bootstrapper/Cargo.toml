[package]
name = "libobs-bootstrapper"
version = "0.4.0"
description = "Inspects pre-packaged OBS runtimes for libobs-rs"
readme = "./README.md"
repository = "https://github.com/libobs-rs/libobs-rs"
documentation = "https://libobs-rs.github.io/libobs-rs/libobs_bootstrapper/"
authors = ["Hendrik Lind <hendrik@sshcrack.me>"]
edition = "2024"
categories = [
    "multimedia::video",
    "multimedia::audio",
    "multimedia",
    "multimedia::encoding",
]
keywords = ["obs", "libobs", "video", "bootstrapper"]
license = "GPL-3.0"


[dependencies]
libobs = { workspace = true }
semver = "1"
libloading = { workspace = true }
log = { workspace = true }
[features]
default = []
generate_bindings = ["libobs/generate_bindings"]
# Retained as an inert compatibility flag. Dummy DLL injection was part of the
# now-disabled runtime bootstrap flow and no longer performs any build action.
install_dummy_dll = []
__ci = []
__mock_github_responses = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[lints]
workspace = true