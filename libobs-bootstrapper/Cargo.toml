[package]
name = "libobs-bootstrapper"
version = "0.4.0"
description = "Explicit runtime provisioning and inspection of OBS runtimes for libobs-rs"
readme = "./README.md"
repository = "https://github.com/libobs-rs/libobs-rs"
documentation = "https://libobs-rs.github.io/libobs-rs/libobs_bootstrapper/"
authors = ["Hendrik Lind <hendrik@sshcrack.me>"]
edition = "2024"
categories = [
    "multimedia::video",
    "multimedia::audio",
    "multimedia",
    "multimedia::encoding",
]
keywords = ["obs", "libobs", "video", "bootstrapper"]
license = "GPL-3.0"

[dependencies]
cargo-obs-build = { path = "../cargo-obs-build", version = "3.0.0", default-features = false }
libloading = { workspace = true }
log = { workspace = true }
semver = "1"
tokio = { workspace = true, features = ["rt"] }

[features]
default = []
# Kept for source compatibility with older manifests. Runtime provisioning no
# longer injects a dummy DLL or generates bindings itself.
generate_bindings = []
install_dummy_dll = []
__ci = []
__mock_github_responses = ["cargo-obs-build/__mock_github_responses"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[lints]
workspace = true
