version = 1

[sandbox]
# Dylint's pinned nightly + rustc-dev/llvm-tools can exceed the default 4 GiB tmpfs
# while OBS and the workspace are being compiled in the same sandbox.
tmp_size = "12g"

[image]
# Stable native prerequisites mirrored from .github/workflows/validation.yml.
# Generic build tools already shipped by the Laptop MCP base image are intentionally omitted.
apt_packages = [
  "extra-cmake-modules",
  "ffmpeg",
  "libasio-dev",
  "libasound2-dev",
  "libavcodec-dev",
  "libavdevice-dev",
  "libavfilter-dev",
  "libavformat-dev",
  "libavutil-dev",
  "libblas-dev",
  "libblas3",
  "libcmocka-dev",
  "libcurl4-openssl-dev",
  "libdrm-dev",
  "libfdk-aac-dev",
  "libffmpeg-nvenc-dev",
  "libfontconfig-dev",
  "libfreetype6-dev",
  "libgl1-mesa-dev",
  "libgles2-mesa-dev",
  "libglib2.0-dev",
  "libglvnd-dev",
  "libjack-jackd2-dev",
  "libjansson-dev",
  "liblapack3",
  "libluajit-5.1-dev",
  "libmbedtls-dev",
  "libpci-dev",
  "libpipewire-0.3-dev",
  "libpulse-dev",
  "libqrcodegencpp-dev",
  "librist-dev",
  "libsimde-dev",
  "libsndio-dev",
  "libspeexdsp-dev",
  "libsrt-openssl-dev",
  "libswresample-dev",
  "libswscale-dev",
  "libudev-dev",
  "libv4l-dev",
  "libva-dev",
  "libvlc-dev",
  "libvpl-dev",
  "libwayland-dev",
  "libwebsocketpp-dev",
  "libx11-dev",
  "libx11-xcb-dev",
  "libx264-dev",
  "libxcb-composite0-dev",
  "libxcb-randr0-dev",
  "libxcb-shm0-dev",
  "libxcb-xfixes0-dev",
  "libxcb-xinerama0-dev",
  "libxcb1-dev",
  "libxcomposite-dev",
  "libxinerama-dev",
  "libxss-dev",
  "nlohmann-json3-dev",
  "python3-dev",
  "qt6-base-dev",
  "qt6-base-private-dev",
  "qt6-image-formats-plugins",
