name: Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-obs-build Installation
        uses: actions/cache@v4
        if: matrix.os != 'ubuntu-latest'
        id: cargo-obs-cache
        with:
          path: |
            obs-build
          key: ${{ runner.os }}-cargo-obs-build-${{ hashFiles('Cargo.toml') }}-v2
      - name: Cache OBS Studio Installation
        uses: actions/cache@v4
        if: matrix.os == 'ubuntu-latest'
        id: obs-cache
        with:
          path: |
            ${{ github.workspace }}/obs-install
          # libobs bindings are generated for a specific OBS ABI. Never restore
          # a cache produced from a different OBS release line.
          key: ${{ runner.os }}-obs-studio-${{ hashFiles('libobs/Cargo.toml', '.github/workflows/validation.yml') }}-v4

      - uses: taiki-e/install-action@nextest

      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: cmake ninja-build pkg-config clang clang-format build-essential curl ccache git zsh libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libcurl4-openssl-dev libmbedtls-dev libgl1-mesa-dev libjansson-dev libluajit-5.1-dev python3-dev libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev libxcomposite-dev libxinerama-dev libxcb1-dev libx11-xcb-dev libxcb-xfixes0-dev swig libcmocka-dev libxss-dev libglvnd-dev libgles2-mesa-dev libwayland-dev librist-dev libsrt-openssl-dev libpci-dev libpipewire-0.3-dev libqrcodegencpp-dev uthash-dev libsimde-dev qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-wayland qt6-image-formats-plugins libasound2-dev libfdk-aac-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev libpulse-dev libsndio-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libvlc-dev libvpl-dev libdrm-dev nlohmann-json3-dev libwebsocketpp-dev libasio-dev libffmpeg-nvenc-dev xvfb ffmpeg libblas-dev libblas3 liblapack3
          version: 1.0
      - name: Ensure OBS CMake dependencies are installed
        if: matrix.os == 'ubuntu-latest'
        run: |
          # cache-apt-pkgs-action restores package files, but packages with
          # installation metadata/scripts are not always fully registered on a
          # cache hit. OBS 32 requires ECM during configure, so install/verify it
          # explicitly instead of trusting the cache restore alone.
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules
          test -f /usr/share/ECM/cmake/ECMConfig.cmake
      - name: Symlink libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/blas/libblas.so.3 /usr/lib/x86_64-linux-gnu/libblas.so.3
          sudo ln -sf /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3 /usr/lib/x86_64-linux-gnu/liblapack.so.3

      - name: Build and Install OBS Studio from Source
        if: matrix.os == 'ubuntu-latest' && steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          # Keep CI on the exact OBS ABI encoded in the libobs crate version.
          # Building "latest" makes an unrelated upstream OBS release silently
          # change both the C ABI and the Linux build dependencies underneath us.
          OBS_VERSION=$(sed -nE 's/^version = "[^"]*\+([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' "${{ github.workspace }}/libobs/Cargo.toml" | head -n1)
          test -n "$OBS_VERSION"
          echo "Building OBS Studio version: $OBS_VERSION"

          git clone --recursive --depth 1 --branch "$OBS_VERSION" \
            https://github.com/obsproject/obs-studio.git /tmp/obs-studio
          cd /tmp/obs-studio

          # Configure build with CMAKE_INSTALL_PREFIX to workspace directory
          cmake --preset ubuntu \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/obs-install \
            -DENABLE_BROWSER=OFF

          # Build OBS Studio
          cmake --build build_ubuntu --parallel $(nproc)

          # Install OBS Studio to local directory
          cmake --install build_ubuntu

      - name: Install cargo-obs-build from crates.io
        uses: baptiste0928/cargo-install@v3
        if: matrix.os != 'ubuntu-latest'
        with:
          crate: cargo-obs-build

      - name: Install cargo-hack from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-hack
      - name: Install cargo-dylint from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-dylint

      - name: Install dylint-link from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dylint-link
      - name: Install OBS build dependencies (Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo obs-build build --out-dir target/debug/deps
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install OBS build dependencies (Windows - nextest)
        if: matrix.os != 'ubuntu-latest'
        run: cargo obs-build build --out-dir target/nextest-all-features/debug/deps
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up virtual display for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Start virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

          # Wait for Xvfb to start
          sleep 3

          # Set display environment variable for subsequent steps
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up OBS environment for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Export environment variables for this session and save for future steps
          export PKG_CONFIG_PATH="${{ github.workspace }}/obs-install/lib/pkgconfig:${{ github.workspace }}/obs-install/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/obs-install/lib:${{ github.workspace }}/obs-install/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "${{github.workspace}}/obs-install/bin" >> $GITHUB_PATH

          # Set RUSTFLAGS to include library search paths
          echo "RUSTFLAGS=-L ${{ github.workspace }}/obs-install/lib -L ${{ github.workspace }}/obs-install/lib/x86_64-linux-gnu" >> $GITHUB_ENV

          # Verify OBS installation
          echo "=== OBS Installation Verification ==="
          if [ -f "${{ github.workspace }}/obs-install/lib/pkgconfig/libobs.pc" ] || [ -f "${{ github.workspace }}/obs-install/lib/x86_64-linux-gnu/pkgconfig/libobs.pc" ]; then
            echo "✓ OBS Studio pkg-config file found"
            if pkg-config --exists libobs; then
              echo "✓ libobs pkg-config validation passed"
              echo "✓ libobs version: $(pkg-config --modversion libobs)"
              echo "✓ libobs cflags: $(pkg-config --cflags libobs)"
              echo "✓ libobs libs: $(pkg-config --libs libobs)"
            else
              echo "✗ libobs pkg-config validation failed"
              exit 1
            fi
          else
            echo "✗ libobs.pc not found in expected locations"
            echo "Searching for libobs.pc..."
            find ${{ github.workspace }}/obs-install -name "libobs.pc" 2>/dev/null || echo "libobs.pc not found in obs-install"
            echo "Available .pc files:"
            find ${{ github.workspace }}/obs-install -name "*.pc" -path "*/pkgconfig/*" | grep -i obs || echo "No OBS-related .pc files found"
            exit 1
          fi
          echo "======================================"

      # Check if formatting is correct
      - name: Check Rust formatting
        run: cargo fmt -- --check
        env:
          TOP_SECRET_NO_DUMMY_DLL: true

      - name: Check Rust with Clippy
        run: cargo clippy -- -D warnings
        env:
          TOP_SECRET_NO_DUMMY_DLL: true

      - name: Check Rust with Dylint
        run: cargo dylint --all --workspace
        env:
          TOP_SECRET_NO_DUMMY_DLL: true
      # Run cargo check to ensure code will compile
      - name: Check code compilation
        run: cargo hack check --feature-powerset --skip generate_bindings,include_win_bindings,__test_environment
        env:
          TOP_SECRET_NO_DUMMY_DLL: true
      - name: Run tests (no default features)
        run: cargo nextest r --profile ci --no-default-features --features "__test_environment"
        env:
          TOP_SECRET_NO_DUMMY_DLL: true
      - name: Run tests (with default features)
        run: cargo nextest r --profile ci --all-features --target-dir target/nextest-all-features
        env:
          TOP_SECRET_NO_DUMMY_DLL: true
  build-test-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install macOS build dependencies
        run: brew install simde

      - name: Install this checkout's cargo-obs-build
        run: cargo install --path cargo-obs-build --features cli --locked --force

      - name: Prepare official OBS runtime
        run: cargo obs-build build --out-dir target/debug/deps
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check macOS wrapper and sources
        run: cargo check -p libobs-wrapper -p libobs-simple --no-default-features
        env:
          TOP_SECRET_NO_DUMMY_DLL: true

      - name: Test target selection and macOS source contract
        run: |
          cargo test -p cargo-obs-build --lib --no-default-features
          cargo test -p libobs-bootstrapper --lib --no-default-features
          cargo test -p libobs-simple --lib --no-default-features
        env:
          TOP_SECRET_NO_DUMMY_DLL: true

  build-test-nix:
    name: Build and Test (Nix)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check Rust formatting (Nix)
        run: nix develop --command cargo fmt -- --check
      - name: Check Rust with Clippy (Nix)
        run: nix develop --command cargo clippy --features __ci -- -D warnings
      - name: Set up virtual display for Linux
        run: |
          # Start virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

          # Wait for Xvfb to start
          sleep 3

          # Set display environment variable for subsequent steps
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: xvfb
          version: 1.0
      - name: Check code compilation (Nix)
        run: nix develop --command cargo hack check --feature-powerset --skip generate_bindings,include_win_bindings,__test_environment --at-least-one-of __ci,__ci
      - name: Run tests (no default features) (Nix)
        run: nix develop --command cargo nextest r --profile ci --no-default-features --features __test_environment,__ci
      - name: Run tests (with default features) (Nix)
        run: nix develop --command cargo nextest r --profile ci --all-features
